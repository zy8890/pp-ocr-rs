[package]
name = "idorc"
version = "0.1.0"
edition = "2021"
description = "中国二代身份证离线 OCR（RapidOCR-ONNX + 结构化解析）"
license = "Apache-2.0"
default-run = "idorc"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
rapidocr-core = "0.2.2"
# rapidocr-core 0.2.2 与 ort 2.0.0-rc.15 API 不兼容，需锁定 rc.12
ort = "=2.0.0-rc.12"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
poem = "3.1.12"
poem-openapi = { version = "5", features = ["redoc", "swagger-ui"] }
base64 = "0.22"

[dev-dependencies]
pretty_assertions = "1"
